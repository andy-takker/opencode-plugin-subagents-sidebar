name: Bug report
description: Report unexpected sidebar behavior
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: OpenCode version and plugin version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, terminal and local-path or npm installation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove credentials, private task names and personal paths.
